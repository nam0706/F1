project:
  name: F1_WinRate_Predictor

execution:
  # Pipeline steps used by: python run_e2e_pipeline.py
  # Valid steps: crawl, clean, base, feature
  # Crawl is intentionally disabled for grading because it is slow and depends
  # on OpenF1/FastF1 network availability. This rebuilds derived artifacts from
  # existing data/raw files.
  steps_to_run:
    - clean
    - base
    - feature

data:
  start_year: 2024
  end_year: 2026
  raw_dir: data/raw
  interim_dir: data/interim
  cleaned_dir: data/cleaned
  processed_dir: data/processed
  preview_dir: data/preview
  metadata_dir: data/metadata
  reports_dir: reports/data_quality

api:
  base_url: https://api.openf1.org/v1
  sleep_seconds: 1
  retry_wait_seconds: 6.0
  max_retries: 5
  timeout_seconds: 30

sessions:
  include_future_sessions: false
  limit_sessions: 99  # Used only when crawl is enabled.
  types:
    - Race
    - Sprint
    - Qualifying
    - Sprint Shootout
    - Sprint Qualifying

# NOTE:
# The current crawler uses its internal endpoint list in src/crawler.py.
# This section documents the expected raw artifacts. It is not used when crawl
# is skipped, which is the default grading/rerun mode above.
raw_endpoints:
  per_year:
    - meetings
  per_session:
    - drivers
    - laps
    - weather
    - intervals
    - stints
    - position
    - race_control
    - pit
    - starting_grid
    - session_result
    - team_radio
    - overtakes
    - car_data
    - location

telemetry:
  enabled: true
  keep_raw: false
  resample_interval: null
